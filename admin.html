<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title>
<style>body{font-family:system-ui;background:#f5f5f7;margin:0;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;box-sizing:border-box}button.primary{background:#0b7a3e;color:#fff;border:0;padding:14px;width:100%;border-radius:10px;font-weight:800}button.del{background:#ef4444;color:#fff;border:0;padding:8px;width:100%;border-radius:8px;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#fff;border-radius:12px;padding:8px}.item img{width:100%;height:110px;object-fit:cover;border-radius:8px}</style></head>
<body>
<h3>Admin Panel</h3>
<div class="card">
<input id="pName" placeholder="Product Name"><input id="pPrice" type="number" placeholder="Price"><input id="pQty" placeholder="Quantity e.g. 1kg"><select id="pCat"><option>Vegetables</option><option>Grocery</option><option>Milk & Products</option><option>Others</option></select><input id="pImg1" placeholder="Image URL - https://..."><button class="primary" onclick="saveProduct()">Add Product</button><div id="msg" style="text-align:center;color:green;font-weight:700;margin-top:6px"></div>
</div>
<h4>Products (<span id="count">0</span>)</h4><div id="list" class="grid"></div>
<script>
let products = JSON.parse(localStorage.getItem('mini_mall_products')||'[]');
function saveToMemory(){localStorage.setItem('mini_mall_products',JSON.stringify(products)); msg.textContent='Added! Check Home Page'; setTimeout(()=>msg.textContent='',2000); render();}
function saveProduct(){let n=pName.value.trim(),pr=parseInt(pPrice.value),qty=pQty.value.trim(),ct=pCat.value,img=pImg1.value.trim(); if(!n||!pr||!qty||!img){alert('Fill all');return} products.unshift({id:Date.now(),name:n,price:pr,qty:qty,cat:ct,images:[img]}); ['pName','pPrice','pQty','pImg1'].forEach(id=>document.getElementById(id).value=''); saveToMemory();}
function deleteProduct(id){if(!confirm('Delete? Home page lo kuda pothundi')) return; products=products.filter(x=>x.id!==id); saveToMemory();}
function render(){count.textContent=products.length; list.innerHTML=products.map(p=>`<div class="item"><img src="${p.images[0]}"><div style="font-weight:700;font-size:13px;margin-top:4px">${p.name}</div><div style="font-size:12px">₹${p.price} • ${p.qty}</div><button class="del" onclick="deleteProduct(${p.id})">Delete</button></div>`).join('');}
render();
</script></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title>
<style>body{font-family:system-ui;background:#f5f5f7;margin:0;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;box-sizing:border-box}button.primary{background:#0b7a3e;color:#fff;border:0;padding:14px;width:100%;border-radius:10px;font-weight:800}button.del{background:#ef4444;color:#fff;border:0;padding:8px;width:100%;border-radius:8px;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#fff;border-radius:12px;padding:8px}.item img{width:100%;height:110px;object-fit:cover;border-radius:8px}.tab{display:flex;gap:8px;margin-bottom:10px}.tab button{flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;background:#fff;font-weight:700}.tab button.active{background:#111;color:#fff}</style></head>
<body>
<h3>Admin Panel</h3>
<div class="tab"><button id="t1" class="active" onclick="showTab('products')">Products</button><button id="t2" onclick="showTab('orders')">Orders</button></div>
<div id="productsTab">
<div class="card"><input id="pName" placeholder="Product Name"><input id="pPrice" type="number" placeholder="Price"><input id="pQty" placeholder="Quantity e.g. 1kg"><select id="pCat"><option>Vegetables</option><option>Grocery</option><option>Milk & Products</option><option>Others</option></select><input id="pImg1" placeholder="Image URL"><button class="primary" onclick="saveProduct()">Add Product</button><div id="msg" style="text-align:center;color:green;font-weight:700;margin-top:6px"></div></div>
<h4>Products (<span id="count">0</span>)</h4><div id="list" class="grid"></div>
<div class="card" style="margin-top:20px"><b>Danger Zone</b><br><small>Only for you</small><button class="del" style="background:#111;margin-top:10px" onclick="safeReset()">Reset Shop (Password Needed)</button></div>
</div>
<div id="ordersTab" style="display:none"><h4>Customer Orders</h4><div id="ordersListAdmin"></div></div>
<script>
let products=JSON.parse(localStorage.getItem('mini_mall_products')||'[]');
function showTab(t){document.getElementById('productsTab').style.display=t==='products'?'block':'none';document.getElementById('ordersTab').style.display=t==='orders'?'block':'none';t1.classList.toggle('active',t==='products');t2.classList.toggle('active',t==='orders');if(t==='orders')renderOrdersAdmin();}
function saveToMemory(){localStorage.setItem('mini_mall_products',JSON.stringify(products));msg.textContent='Added! Check Home';setTimeout(()=>msg.textContent='',2000);render();}
function saveProduct(){let n=pName.value.trim(),pr=parseInt(pPrice.value),qty=pQty.value.trim(),ct=pCat.value,img=pImg1.value.trim();if(!n||!pr||!qty||!img){alert('Fill all');return}products.unshift({id:Date.now(),name:n,price:pr,qty:qty,cat:ct,images:[img]});['pName','pPrice','pQty','pImg1'].forEach(id=>document.getElementById(id).value='');saveToMemory();}
function deleteProduct(id){if(!confirm('Delete? Home lo kuda pothundi'))return;products=products.filter(x=>x.id!==id);saveToMemory();}
function render(){count.textContent=products.length;list.innerHTML=products.map(p=>`<div class="item"><img src="${p.images[0]}"><div style="font-weight:700;font-size:13px;margin-top:4px">${p.name}</div><div style="font-size:12px">₹${p.price} • ${p.qty}</div><button class="del" onclick="deleteProduct(${p.id})">Delete</button></div>`).join('');}
function safeReset(){let p=prompt('Admin password to reset shop:');if(p!=='admin123'){alert('Wrong');return;}if(confirm('Are you sure? All products will be deleted')){localStorage.removeItem('mini_mall_products');products=[];render();alert('Shop Reset Done');}}
function renderOrdersAdmin(){let orders=JSON.parse(localStorage.getItem('mini_mall_orders')||'[]');if(!orders.length){ordersListAdmin.innerHTML='<div style="padding:20px;color:#888">No orders yet</div>';return;}ordersListAdmin.innerHTML=orders.map(o=>`<div class="card"><b>#${o.id.toString().slice(-6)} - ${o.customer.name} - ${o.customer.phone}</b><div style="font-size:13px;margin:6px 0">${o.name} - ₹${o.total}</div><div style="font-size:12px;color:#666">${o.customer.plot}, ${o.customer.apt}, ${o.customer.addr}</div><div style="margin-top:8px"><select onchange="updateStatus(${o.id},this.value)"><option ${o.status==='Placed'?'selected':''}>Placed</option><option ${o.status==='Packed'?'selected':''}>Packed</option><option ${o.status==='Shipped'?'selected':''}>Shipped</option><option ${o.status==='Out for Delivery'?'selected':''}>Out for Delivery</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option></select></div></div>`).join('');}
function updateStatus(id,st){let orders=JSON.parse(localStorage.getItem('mini_mall_orders')||'[]');let o=orders.find(x=>x.id===id);if(o){o.status=st;localStorage.setItem('mini_mall_orders',JSON.stringify(orders));renderOrdersAdmin();alert('Status updated to '+st);}}
render();
</script></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title>
<style>body{font-family:system-ui;background:#f5f5f7;margin:0;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;box-sizing:border-box}button.primary{background:#0b7a3e;color:#fff;border:0;padding:14px;width:100%;border-radius:10px;font-weight:800}button.del{background:#fee;color:#c00;border:0;padding:8px;border-radius:8px}button.edit{background:#e0f2fe;color:#075985;border:0;padding:8px;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#fff;border-radius:12px;padding:8px;position:relative}.item img{width:100%;height:110px;object-fit:cover;border-radius:8px}.tab{display:flex;gap:8px;margin-bottom:10px}.tab button{flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;background:#fff;font-weight:700}.tab button.active{background:#111;color:#fff}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}.box{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:16px}</style></head>
<body>
<h3>Admin Panel - Umasvara</h3>
<div class="tab"><button id="t1" class="active" onclick="showTab('products')">Products</button><button id="t2" onclick="showTab('orders')">Orders</button></div>
<div id="productsTab">
<div class="card"><b id="formTitle">Add Product</b><input id="pName" placeholder="Name"><input id="pPrice" type="number" placeholder="Price"><input id="pQty" placeholder="Qty e.g. 1kg / 2kg"><select id="pCat"><option>Vegetables</option><option>Grocery</option><option>Milk & Products</option><option>Others</option></select><input id="pImg1" placeholder="Image URL (paste)"><button class="primary" id="saveBtn" onclick="saveProduct()">Add Product</button><button id="cancelBtn" style="display:none;width:100%;padding:10px;background:#eee;border:0;border-radius:10px;margin-top:8px" onclick="cancelEdit()">Cancel Edit</button><div id="msg" style="text-align:center;color:green;font-weight:700;margin-top:6px"></div></div>
<div style="display:flex;justify-content:space-between;align-items:center"><h4>Products (<span id="count">0</span>)</h4><small>Edit price daily</small></div><div id="list" class="grid"></div>
<div class="card"><b>Settings</b><input id="sUpi" placeholder="UPI ID e.g. umasvara@upi"><input id="sWa" placeholder="Your WhatsApp No e.g. 919052878711"><input id="sDel" type="number" placeholder="Delivery Charge"><button class="primary" onclick="saveSettings()">Save Settings</button></div>
<div class="card"><button class="primary" style="background:#111" onclick="safeReset()">Reset Shop (Password)</button></div>
</div>
<div id="ordersTab" style="display:none"><h4>Live Orders</h4><div id="ordersListAdmin"></div></div>

<div id="editModal" class="modal"><div class="box"><h3>Edit Product</h3><p style="font-size:12px;color:#666">Price change cheyochu - image same unchandi</p><div id="editForm"></div></div></div>

<script>
let products=JSON.parse(localStorage.getItem('mini_mall_products')||'[]');
let editId=null;
let settings=JSON.parse(localStorage.getItem('mini_mall_settings')||'{"upi":"umasvara@upi","wa":"919052878711","delivery":0}');
sUpi.value=settings.upi; sWa.value=settings.wa; sDel.value=settings.delivery;

function showTab(t){document.getElementById('productsTab').style.display=t==='products'?'block':'none';document.getElementById('ordersTab').style.display=t==='orders'?'block':'none';t1.classList.toggle('active',t==='products');t2.classList.toggle('active',t==='orders');if(t==='orders')renderOrdersAdmin();}
function saveToMemory(){localStorage.setItem('mini_mall_products',JSON.stringify(products));msg.textContent=editId?'Updated!':'Added!';setTimeout(()=>msg.textContent='',2000);render();cancelEdit();}
function saveProduct(){let n=pName.value.trim(),pr=parseInt(pPrice.value),qty=pQty.value.trim(),ct=pCat.value,img=pImg1.value.trim();if(!n||!pr||!qty||!img){alert('Fill all');return}
 if(editId){let p=products.find(x=>x.id===editId);p.name=n;p.price=pr;p.qty=qty;p.cat=ct;p.images[0]=img;}
 else{products.unshift({id:Date.now(),name:n,price:pr,qty:qty,cat:ct,images:[img]});}
 saveToMemory();
}
function editProduct(id){let p=products.find(x=>x.id===id);editId=id;pName.value=p.name;pPrice.value=p.price;pQty.value=p.qty;pCat.value=p.cat;pImg1.value=p.images[0];formTitle.textContent='Edit Product - '+p.name;saveBtn.textContent='Update Price';cancelBtn.style.display='block';window.scrollTo(0,0);}
function cancelEdit(){editId=null;['pName','pPrice','pQty','pImg1'].forEach(id=>document.getElementById(id).value='');formTitle.textContent='Add Product';saveBtn.textContent='Add Product';cancelBtn.style.display='none';}
function deleteProduct(id){if(!confirm('Delete permanently?'))return;products=products.filter(x=>x.id!==id);saveToMemory();}
function render(){count.textContent=products.length;list.innerHTML=products.map(p=>`<div class="item"><img src="${p.images[0]}"><div style="font-weight:700;font-size:13px;margin-top:4px">${p.name}</div><div style="font-size:12px">₹${p.price} • ${p.qty}</div><div style="display:flex;gap:4px;margin-top:6px"><button class="edit" style="flex:1" onclick="editProduct(${p.id})">Edit</button><button class="del" style="flex:1" onclick="deleteProduct(${p.id})">Del</button></div></div>`).join('');}
function saveSettings(){settings={upi:sUpi.value,wa:sWa.value,delivery:parseInt(sDel.value)||0};localStorage.setItem('mini_mall_settings',JSON.stringify(settings));alert('Settings saved!');}
function safeReset(){let p=prompt('Password:');if(p!=='admin123'){alert('Wrong');return;}if(confirm('Delete ALL products?')){localStorage.removeItem('mini_mall_products');products=[];render();}}
function renderOrdersAdmin(){let orders=JSON.parse(localStorage.getItem('mini_mall_orders')||'[]');if(!orders.length){ordersListAdmin.innerHTML='<div style="padding:20px;color:#888">No orders</div>';return;}ordersListAdmin.innerHTML=orders.map(o=>`<div class="card"><b>#${o.id.toString().slice(-6)} - ${o.customer.name} (${o.customer.pay}) - ₹${o.total}</b><div style="font-size:13px;margin:6px 0">${o.name}</div><div style="font-size:12px;color:#666">${o.customer.plot}, ${o.customer.apt}, ${o.customer.addr} - ${o.customer.phone}</div><div style="margin-top:8px;display:flex;gap:6px"><select style="flex:1" onchange="updateStatus(${o.id},this.value)"><option ${o.status==='Placed'?'selected':''}>Placed</option><option ${o.status==='Packed'?'selected':''}>Packed</option><option ${o.status==='Shipped'?'selected':''}>Shipped</option><option ${o.status==='Out for Delivery'?'selected':''}>Out for Delivery</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option></select><button onclick="sendWa(${o.id})" style="padding:8px 12px;background:#25D366;color:#fff;border:0;border-radius:8px">WhatsApp Customer</button></div></div>`).join('');}
function updateStatus(id,st){let orders=JSON.parse(localStorage.getItem('mini_mall_orders')||'[]');let o=orders.find(x=>x.id===id);if(o){o.status=st;localStorage.setItem('mini_mall_orders',JSON.stringify(orders));renderOrdersAdmin();}}
function sendWa(id){let orders=JSON.parse(localStorage.getItem('mini_mall_orders')||'[]');let o=orders.find(x=>x.id===id);let txt=`Hi ${o.customer.name}, Your order #${o.id.toString().slice(-6)} is ${o.status}. Total ₹${o.total}. Thank you - Mini-Mall`;window.open(`https://wa.me/${o.customer.phone}?text=${encodeURIComponent(txt)}`);}
render();
</script></body></html>

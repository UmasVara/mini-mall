<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Mall - Live Shop</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  body{font-family:sans-serif;padding:20px}
  .product{border:1px solid #ccc;padding:10px;margin:10px;border-radius:8px}
  img{max-width:100px}
</style>
</head>
<body>
<h1>Mini Mall 🛒 LIVE</h1>

<div id="admin">
<h3>Add Product (Admin)</h3>
<input id="pname" placeholder="Product Name">
<input id="pprice" placeholder="Price" type="number">
<input id="pimage" placeholder="Image URL">
<button onclick="addProduct()">Add to Shop</button>
<hr>
</div>

<div id="products">Loading products...</div>

<script>
// YOUR CONFIG - YOU GAVE ME
const firebaseConfig = {
  apiKey: "AIzaSyCNUpsZ3KOAAdn3-CSQhS65gcKqDDxAjSs",
  authDomain: "mini-mall-94817.firebaseapp.com",
  projectId: "mini-mall-94817",
  storageBucket: "mini-mall-94817.firebasestorage.app",
  messagingSenderId: "638018323167",
  appId: "1:638018323167:web:df3ba18d8b78a592401f6a",
  measurementId: "G-9CG687KC6G"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ADD PRODUCT - Saves to cloud
function addProduct(){
  const name = document.getElementById('pname').value;
  const price = document.getElementById('pprice').value;
  const image = document.getElementById('pimage').value;
  if(!name || !price) return alert("Add name & price");
  
  db.collection("products").add({
    name: name,
    price: price,
    image: image,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    alert("Product Added LIVE!");
    document.getElementById('pname').value='';
    document.getElementById('pprice').value='';
    document.getElementById('pimage').value='';
  });
}

// LIVE SYNC - All users see same products
db.collection("products").orderBy("createdAt","desc")
.onSnapshot((snapshot)=>{
  const container = document.getElementById('products');
  container.innerHTML = "";
  snapshot.forEach((doc)=>{
    const p = doc.data();
    container.innerHTML += `
      <div class="product">
        <img src="${p.image || 'https://via.placeholder.com/100'}" />
        <h4>${p.name}</h4>
        <p>₹${p.price}</p>
      </div>
    `;
  });
  if(snapshot.empty) container.innerHTML = "No products yet. Add one!";
});
</script>
</body>
</html>

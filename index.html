
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Mall - Live</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50">
<div class="bg-white shadow-sm sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="text-2xl font-bold">Mini Mall 🛒 LIVE</h1>
    <div class="flex gap-2"><button onclick="toggleCart()" class="bg-black text-white px-4 py-2 rounded-full text-sm">Cart (<span id="cartCount">0</span>)</button></div>
  </div>
</div>

<div class="max-w-6xl mx-auto px-4 py-6 grid md:grid-cols-3 gap-6">
  <!-- ADMIN - HIDDEN BY DEFAULT -->
  <div id="adminPanel" class="hidden md:col-span-1 bg-white p-5 rounded-2xl shadow-sm h-fit border-2 border-black">
    <h2 class="font-bold text-lg mb-3">Admin Panel 🔒</h2>
    <input id="pname" placeholder="Product Name" class="w-full border p-2.5 rounded-lg mb-2">
    <input id="pprice" type="number" placeholder="Price ₹" class="w-full border p-2.5 rounded-lg mb-2">
    <input id="pqty" type="number" placeholder="Quantity / Stock" class="w-full border p-2.5 rounded-lg mb-2">
    <input id="pimage" placeholder="Image URL" class="w-full border p-2.5 rounded-lg mb-3">
    <button onclick="addProduct()" class="w-full bg-black text-white py-3 rounded-xl font-semibold">+ Add LIVE</button>
    <button onclick="logoutAdmin()" class="w-full mt-2 text-xs text-gray-500">Logout Admin</button>
  </div>

  <!-- Products -->
  <div id="productsWrap" class="md:col-span-3">
    <div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-4">Loading...</div>
  </div>
</div>

<!-- Secret Admin Login in footer -->
<div class="text-center py-10"><button onclick="adminLogin()" class="text-[10px] text-gray-300">Admin Login</button></div>

<div id="cartDrawer" class="fixed inset-0 bg-black/40 hidden z-20">
  <div class="bg-white w-80 ml-auto h-full p-5 flex flex-col">
    <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-xl">Your Cart</h3><button onclick="toggleCart()">✕</button></div>
    <div id="cartItems" class="flex-1 overflow-auto"></div>
    <button class="bg-green-600 text-white py-3 rounded-xl mt-4">Order on WhatsApp</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCNUpsZ3KOAAdn3-CSQhS65gcKqDDxAjSs",
  authDomain: "mini-mall-94817.firebaseapp.com",
  projectId: "mini-mall-94817",
  storageBucket: "mini-mall-94817.firebasestorage.app",
  messagingSenderId: "638018323167",
  appId: "1:638018323167:web:df3ba18d8b78a592401f6a",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let cart = []; let isAdmin = false;

// CHECK ADMIN - URL ?admin=nasvara OR localStorage
function checkAdmin(){
  const urlParams = new URLSearchParams(window.location.search);
  if(urlParams.get('admin') === 'nasvara' || localStorage.getItem('isAdmin') === 'true'){
    isAdmin = true;
    document.getElementById('adminPanel').classList.remove('hidden');
    document.getElementById('productsWrap').className = "md:col-span-2";
  }
}
checkAdmin();

function adminLogin(){
  const pass = prompt("Enter Admin Password:");
  if(pass === "nasvara123"){
    localStorage.setItem('isAdmin','true');
    location.reload();
  } else if(pass) alert("Wrong password!");
}
function logoutAdmin(){ localStorage.removeItem('isAdmin'); location.href = location.pathname; }

function addProduct(){
  if(!isAdmin) return;
  const name = pname.value.trim(); const price = pprice.value; const qty = pqty.value || 1; const image = pimage.value.trim();
  if(!name || !price) return alert("Enter name & price");
  db.collection("products").add({name, price: Number(price), qty: Number(qty), image, createdAt: firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{pname.value='';pprice.value='';pqty.value='';pimage.value='';});
}

db.collection("products").orderBy("createdAt","desc").onSnapshot(snap=>{
  const con = document.getElementById('products'); con.innerHTML = "";
  if(snap.empty){ con.innerHTML = "<p class='col-span-4 text-center text-gray-400 py-20'>No products yet.</p>"; return; }
  snap.forEach(doc=>{
    const p = doc.data(); const id = doc.id;
    con.innerHTML += `
      <div class="bg-white rounded-2xl p-3 shadow-sm">
        <img src="${p.image || 'https://via.placeholder.com/300'}" class="w-full h-36 object-cover rounded-xl mb-3">
        <h4 class="font-semibold text-sm">${p.name}</h4>
        <div class="flex justify-between items-center mt-1">
          <p class="font-bold">₹${p.price}</p>
          <span class="text-xs ${p.qty>0?'bg-green-100 text-green-700':'bg-red-100 text-red-700'} px-2 py-1 rounded-full">${p.qty>0?p.qty+' left':'Out of stock'}</span>
        </div>
        <button onclick="addToCart('${id}','${p.name.replace(/'/g,"")} ',${p.price})" class="w-full bg-black text-white text-xs py-2 rounded-lg mt-3">Add to Cart</button>
        ${isAdmin?`<button onclick="deleteProduct('${id}')" class="w-full text-[10px] text-red-400 mt-2">Delete (Admin)</button>`:''}
      </div>
    `;
  });
});

function addToCart(id,name,price){ cart.push({id,name,price}); renderCart(); toggleCart(); }
function renderCart(){
  cartCount.innerText = cart.length;
  const c = document.getElementById('cartItems'); let total=0; c.innerHTML="";
  cart.forEach(item=>{ total+=item.price; c.innerHTML+=`<div class="flex justify-between py-2 border-b text-sm"><span>${item.name}</span><span>₹${item.price}</span></div>`; });
  if(cart.length) c.innerHTML+=`<div class="font-bold flex justify-between mt-3"><span>Total</span><span>₹${total}</span></div>`;
}
function toggleCart(){ document.getElementById('cartDrawer').classList.toggle('hidden'); }
function deleteProduct(id){ if(isAdmin && confirm("Delete?")) db.collection("products").doc(id).delete(); }
</script>
</body>
</html>

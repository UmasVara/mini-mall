<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini-Mall</title>
<style>body{font-family:system-ui;background:#f5f5f7;margin:0}header{background:#111;color:#fff;padding:14px;text-align:center;font-weight:800;font-size:18px}header span{color:#ff6a00}.cats{display:flex;gap:8px;overflow:auto;padding:10px}.cats button{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;white-space:nowrap}.cats button.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.06);cursor:pointer}.card img{width:100%;height:170px;object-fit:cover}.info{padding:8px}.price{color:#e91e63;font-weight:800}.mrp{color:#888;text-decoration:line-through;font-size:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}.box{background:#fff;border-radius:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto}.m-img{width:100%;height:300px;object-fit:contain;background:#f5f5f5}.thumbs{display:flex;gap:6px;padding:10px;overflow:auto}.thumbs img{width:56px;height:56px;border-radius:8px;border:2px solid transparent;object-fit:cover}.thumbs img.active{border-color:#111}</style></head>
<body>
<header><span>Mini</span>-Mall - All In One</header>
<div class="cats" id="cats"><button class="active" onclick="filterCat('All',this)">All</button><button onclick="filterCat('Vegetables',this)">Vegetables</button><button onclick="filterCat('Grocery',this)">Grocery</button><button onclick="filterCat('Mens',this)">Mens</button><button onclick="filterCat('Sarees',this)">Sarees</button><button onclick="filterCat('Home',this)">Home</button></div>
<div id="ordersBox" style="background:#fff;margin:10px;border-radius:12px;padding:12px;display:none"><h3 style="margin:0 0 8px">My Orders - Can Delete</h3><div id="ordersList"></div></div>
<div id="grid" class="grid"></div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')this.style.display='none'"><div class="box"><img id="mImg" class="m-img"><div id="mThumbs" class="thumbs"></div><div id="mVideo" style="padding:10px"></div><div style="padding:12px"><h3 id="mName" style="margin:0"></h3><div><span class="price" id="mPrice"></span> <span class="mrp" id="mMrp"></span> <span id="mDisc" style="background:#111;color:#fff;padding:2px 6px;border-radius:5px;font-size:11px"></span></div><div style="font-size:11px;color:#666;margin-top:4px" id="mCat"></div><button onclick="placeOrder()" style="width:100%;padding:13px;background:#111;color:#fff;border:0;border-radius:10px;font-weight:800;margin-top:10px">Buy Now</button><button onclick="modal.style.display='none'" style="width:100%;padding:12px;background:#eee;border:0;border-radius:10px;margin-top:8px">Close</button></div></div></div>
<script>
let products=[]; try{products=JSON.parse(localStorage.getItem('minimall_products')||'[]')}catch(e){}
let orders=[]; try{orders=JSON.parse(localStorage.getItem('minimall_orders')||'[]')}catch(e){}
let cur=null, curFilter='All';
if(products.length===0){products=[
{id:1,name:'Fresh Tomato 1kg',price:30,mrp:50,cat:'Vegetables',images:['https://images.unsplash.com/photo-1582284540020-8acbe03f4924?w=500'],video:''},
{id:2,name:'Mens Casual Shirt',price:600,mrp:2000,cat:'Mens',images:['https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500'],video:''},
{id:3,name:'Atta 5kg',price:180,mrp:250,cat:'Grocery',images:['https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=500'],video:''}
];}
function filterCat(c,btn){curFilter=c;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderProducts();}
function renderProducts(){let list=curFilter==='All'?products:products.filter(p=>p.cat===curFilter);grid.innerHTML=list.map((p,i)=>`<div class="card" onclick="openP(${products.indexOf(p)})"><img src="${p.images[0]}"><div class="info"><div style="font-weight:700">${p.name}</div><div><span class="price">₹${p.price}</span> <span class="mrp">₹${p.mrp}</span></div><div style="font-size:10px;color:#888">${p.cat}</div></div></div>`).join('');}
function openP(i){cur=products[i];modal.style.display='flex';mName.textContent=cur.name;mPrice.textContent='Our ₹'+cur.price;mMrp.textContent='MRP ₹'+cur.mrp;mCat.textContent=cur.cat;let disc=cur.mrp>cur.price?Math.round((cur.mrp-cur.price)/cur.mrp*100):0;mDisc.textContent=disc?disc+'% OFF':'';mImg.src=cur.images[0];mThumbs.innerHTML=cur.images.map((im,j)=>`<img src="${im}" class="${j==0?'active':''}" onclick="mImg.src=this.src;document.querySelectorAll('#mThumbs img').forEach(x=>x.classList.remove('active'));this.classList.add('active')">`).join('');let v=cur.video||'',vh='';if(v){if(v.includes('youtu')){let id=v.split('v=')[1]?.split('&')[0]||v.split('/').pop().split('?')[0];vh=`<iframe height="210" width="100%" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen style="border-radius:10px"></iframe>`;}else{vh=`<video controls width="100%" src="${v}" style="border-radius:10px"></video>`;}}mVideo.innerHTML=vh?'<b>Video</b>'+vh:'';}
function placeOrder(){orders.unshift({id:Date.now(),name:cur.name,price:cur.price,mrp:cur.mrp,image:cur.images[0],date:new Date().toLocaleString()});localStorage.setItem('minimall_orders',JSON.stringify(orders));renderOrders();modal.style.display='none';alert('Order Placed!');}
function deleteOrder(id){if(confirm('Delete order?')){orders=orders.filter(o=>o.id!==id);localStorage.setItem('minimall_orders',JSON.stringify(orders));renderOrders();}}
function renderOrders(){if(!orders.length){ordersBox.style.display='none';return;}ordersBox.style.display='block';ordersList.innerHTML=orders.map(o=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee"><div style="display:flex;gap:8px"><img src="${o.image}" style="width:40px;height:40px;border-radius:6px;object-fit:cover"><div><div style="font-weight:700">${o.name}</div><div style="font-size:11px">Our ₹${o.price} MRP ₹${o.mrp} - ${o.date}</div></div></div><button onclick="deleteOrder(${o.id})" style="background:#222;color:#fff;border:0;padding:6px 12px;border-radius:7px">Delete</button></div>`).join('');}
renderProducts();renderOrders();
</script>
</body></html>

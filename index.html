<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini-Mall</title>
<style>
body{font-family:system-ui;background:#f5f5f7;margin:0;overflow-x:hidden}
header{background:#0b7a3e;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;font-weight:800;position:sticky;top:0;z-index:20}
.left{display:flex;align-items:center;gap:10px}
.menuBtn{font-size:26px;background:none;border:0;color:#fff}
.logo{user-select:none;-webkit-user-select:none;cursor:pointer}
.cartBtn{background:#fff;color:#0b7a3e;padding:7px 16px;border-radius:20px;border:0;font-weight:800;position:relative}
.count{position:absolute;top:-6px;right:-6px;background:red;color:#fff;border-radius:50%;width:19px;height:19px;font-size:12px;display:flex;align-items:center;justify-content:center}
.side{position:fixed;top:0;left:0;width:250px;height:100%;background:#fff;z-index:100;transform:translateX(-100%);transition:0.3s;padding:20px;overflow-y:auto}
.side.open{transform:translateX(0);box-shadow:2px 0 15px rgba(0,0,0,.3)}
.side a{display:block;padding:13px 0;border-bottom:1px solid #eee;text-decoration:none;color:#111;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:90}
.cats{display:flex;gap:8px;overflow:auto;padding:10px;position:sticky;top:56px;background:#f5f5f7;z-index:9}
.cats button{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;white-space:nowrap}
.cats button.active{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08);border:1px solid #eee}
.card img{width:100%;height:150px;object-fit:cover;cursor:pointer}
.info{padding:8px}
.mrp{color:#0b7a3e;font-weight:800;font-size:15px}
.qty{color:#666;font-size:11px}
.addBtn{width:100%;margin-top:7px;padding:9px;background:#0b7a3e;color:#fff;border:0;border-radius:8px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99;padding:16px;overflow:auto}
.box{background:#fff;border-radius:16px;max-width:440px;width:100%;max-height:95vh;overflow:auto}
.m-img{width:100%;height:260px;object-fit:contain;background:#f5f5f5}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px;box-sizing:border-box}
button.pay{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;margin-top:8px}
.status{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff}
.st-Placed{background:#f59e0b}.st-Packed{background:#3b82f6}.st-Shipped{background:#8b5cf6}.st-Delivered{background:#10b981}
.cartItem{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.qBtn{padding:4px 10px;border:1px solid #ddd;background:#fff;border-radius:6px;font-weight:800}
</style></head>
<body>
<header>
<div class="left"><button class="menuBtn" onclick="toggleMenu()">☰</button><span class="logo" id="storeName" onclick="tapLogo()">Mini-Mall</span></div>
<button class="cartBtn" onclick="openCart()">🛒 Cart <span id="cartCount" class="count" style="display:none">0</span></button>
</header>

<div id="side" class="side">
<h3 style="margin-top:0">Mini-Mall Menu</h3>
<a href="#" onclick="toggleMenu();window.scrollTo(0,0)">🏠 Home Shop</a>
<a href="#" onclick="openCart();toggleMenu()">🛒 My Cart</a>
<a href="#" onclick="toggleOrders();toggleMenu()">📦 My Orders - Tracking</a>
<a href="#" onclick="clearCache()">♻️ Clear Cache</a>
<p style="font-size:11px;color:#888;margin-top:20px">Fresh Vegetables • Grocery<br>Milk & Products • Others</p>
</div>
<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div class="cats"><button class="active" onclick="filterCat('All',this)">All</button><button onclick="filterCat('Vegetables',this)">Vegetables</button><button onclick="filterCat('Grocery',this)">Grocery</button><button onclick="filterCat('Milk & Products',this)">Milk & Products</button><button onclick="filterCat('Others',this)">Others</button></div>

<div id="ordersBox" style="background:#fff;margin:10px;border-radius:12px;padding:12px;display:none"><h3 style="margin:0 0 8px">My Orders - Tracking</h3><div id="ordersList"></div></div>
<div id="grid" class="grid"></div>

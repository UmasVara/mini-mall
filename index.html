<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Mall LIVE - Fixed</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
.no-scrollbar::-webkit-scrollbar{display:none}
#cartBox,#trackBox{display:none} /* Force hide - fixes click bug */
#cartBox.active,#trackBox.active{display:flex}
</style>
</head>
<body class="bg-gray-50">

<div class="bg-white p-4 flex justify-between shadow sticky top-0 z-20">
  <h1 id="shopTitle" class="font-bold text-[20px] select-none cursor-pointer">Mini Mall 🛒 LIVE</h1>
  <div class="flex gap-2">
    <button id="trackBtn" class="bg-gray-200 px-4 py-2 rounded-full text-xs font-bold">Track Order</button>
    <button id="cartBtn" class="bg-black text-white px-5 py-2 rounded-full text-sm font-bold">Cart (<span id="cartCount">0</span>)</button>
  </div>
</div>

<div id="toast" style="display:none" class="fixed top-20 left-1/2 -translate-x-1/2 bg-black text-white text-xs px-4 py-2 rounded-full z-50">Added to Cart ✓</div>

<div class="max-w-6xl mx-auto p-4">
  <div id="adminPanel" style="display:none" class="bg-white p-5 rounded-2xl shadow-lg mb-6 border-2 border-black">
    <div class="flex gap-2 mb-4 flex-wrap">
      <button onclick="tab('products')" id="t-products" class="bg-black text-white px-4 py-2 rounded-lg text-sm">Products</button>
      <button onclick="tab('orders')" id="t-orders" class="bg-gray-200 px-4 py-2 rounded-lg text-sm">Orders</button>
      <button onclick="tab('payment')" id="t-payment" class="bg-gray-200 px-4 py-2 rounded-lg text-sm">Payment</button>
      <button onclick="logout()" class="ml-auto text-red-500 text-xs font-bold">Logout</button>
    </div>
    <div id="admin-products">
      <input id="pname" placeholder="Product Name" class="w-full border p-2.5 rounded-lg mb-2">
      <label class="text-[10px] font-bold">Direct Photo Upload (No URL needed)</label>
      <input id="pfile" type="file" accept="image/*" class="w-full border p-2 rounded-lg bg-white text-xs mb-2">
      <img id="preview" style="display:none" class="w-20 h-20 object-cover rounded-lg mb-2 border">
      <input id="pimage" placeholder="Or Image URL https://..." class="w-full border p-2.5 rounded-lg mb-2">
      <select id="pcat" class="w-full border p-2.5 rounded-lg mb-2 bg-white"><option>Vegetables</option><option>Grocery</option><option>Milk</option><option>Fruits</option><option>Others</option></select>
      <div id="varList" class="space-y-2 mb-2"></div>
      <button onclick="addVar()" class="text-xs text-blue-600">+ Add variant</button>
      <button onclick="addProduct()" id="addBtn" class="w-full bg-black text-white py-3 rounded-xl font-bold mt-2">+ Add Product</button>
      <p id="uploadStatus" style="display:none" class="text-xs text-blue-600 mt-2">Processing...</p>
      <div id="adminProdList" class="mt-4"></div>
    </div>
    <div id="admin-orders" style="display:none"><div class="flex gap-2 mb-3"><button onclick="orderTab='active';loadOrders()" id="ot-active" class="bg-black text-white px-4 py-2 rounded-full text-xs">Active New Top</button><button onclick="orderTab='completed';loadOrders()" id="ot-completed" class="bg-gray-200 px-4 py-2 rounded-full text-xs">Completed</button></div><div id="ordersList"></div></div>
    <div id="admin-payment" style="display:none" class="space-y-2"><label class="flex gap-2 text-sm"><input type="checkbox" id="enableCOD" checked> COD</label><label class="flex gap-2 text-sm"><input type="checkbox" id="enableUPI" checked> UPI</label><input id="upiId" placeholder="UPI ID" class="w-full border p-2.5 rounded-lg"><label class="flex gap-2 text-sm"><input type="checkbox" id="enableWA" checked> WhatsApp</label><input id="waNum" placeholder="9198..." class="w-full border p-2.5 rounded-lg"><div class="flex gap-2"><input id="freeAbove" type="number" placeholder="Free above" class="w-1/2 border p-2 rounded"><input id="delCharge" type="number" placeholder="Charge" class="w-1/2 border p-2 rounded"></div><button onclick="savePay()" class="w-full bg-green-600 text-white py-3 rounded-xl">Save</button></div>
  </div>

  <div id="catFilter" class="flex gap-2 overflow-x-auto pb-3 mb-2 no-scrollbar">
    <button onclick="filterCat('All')" data-cat="All" class="cat-btn bg-black text-white px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">All</button>
    <button onclick="filterCat('Vegetables')" data-cat="Vegetables" class="cat-btn bg-white border px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">🥕 Vegetables</button>
    <button onclick="filterCat('Grocery')" data-cat="Grocery" class="cat-btn bg-white border px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">🛒 Grocery</button>
    <button onclick="filterCat('Milk')" data-cat="Milk" class="cat-btn bg-white border px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">🥛 Milk</button>
    <button onclick="filterCat('Fruits')" data-cat="Fruits" class="cat-btn bg-white border px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">🍎 Fruits</button>
    <button onclick="filterCat('Others')" data-cat="Others" class="cat-btn bg-white border px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap">📦 Others</button>
  </div>

  <div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-4"><div class="col-span-4 text-center py-20 text-gray-400">Loading...</div></div>
</div>

<div id="trackBox" class="fixed inset-0 bg-black/60 z-40 flex items-start justify-center pt-16"><div class="bg-white w-[95%] max-w-md p-6 rounded-2xl"><div class="flex justify-between"><b>Track Order</b><button id="closeTrack" class="text-xl">✕</button></div><input id="trackInput" placeholder="Order ID or Phone" class="w-full border p-3 rounded-xl mt-4"><button onclick="doTrack()" class="w-full bg-black text-white py-3 rounded-xl mt-3">Track</button><div id="trackRes" class="mt-4 max-h-96 overflow-auto"></div></div></div>
<div id="cartBox" class="fixed inset-0 bg-black/60 z-40"><div class="bg-white w-[90%] max-w-sm ml-auto h-full p-5 flex flex-col"><div class="flex justify-between mb-4"><b>Checkout</b><button id="closeCart">✕</button></div><div id="cartItems" class="flex-1 overflow-auto"></div><div class="border-t pt-3 space-y-2"><input id="cName" placeholder="Name" class="w-full border p-2.5 rounded-lg"><input id="cPhone" placeholder="Phone" class="w-full border p-2.5 rounded-lg"><input id="cAddr" placeholder="Address" class="w-full border p-2.5 rounded-lg"><div id="payInfo" class="bg-gray-100 p-2 rounded text-xs"></div><select id="payMethod" class="w-full border p-2.5 rounded-lg"></select><button onclick="placeOrder()" class="w-full bg-black text-white py-3 rounded-xl font-bold">Place Order</button></div></div></div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCNUpsZ3KOAAdn3-CSQhS65gcKqDDxAjSs", authDomain: "mini-mall-94817.firebaseapp.com", projectId: "mini-mall-94817", storageBucket: "mini-mall-94817.firebasestorage.app", messagingSenderId: "638018323167", appId: "1:638018323167:web:df3ba18d8b78a592401f6a" };
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let cart=JSON.parse(localStorage.getItem('minimall_cart_v2')||'[]'),editId=null,isAdmin=false,allProducts=[],currentCat='All',orderTab='active';
let payment={enableCOD:true,enableUPI:true,enableWA:true,upiId:"",waNum:"919052878711",freeAbove:500,delCharge:30};
function openCart(){ document.getElementById('cartBox').classList.toggle('active'); renderCart(); }
function openTrack(){ document.getElementById('trackBox').classList.toggle('active'); }
document.getElementById('cartBtn').onclick=openCart; document.getElementById('trackBtn').onclick=openTrack;
document.getElementById('closeCart').onclick=openCart; document.getElementById('closeTrack').onclick=openTrack;
let tapCount=0,lastTap=0; document.getElementById('shopTitle').onclick=function(){ const now=Date.now(); if(now-lastTap>1500) tapCount=0; tapCount++; lastTap=now; if(tapCount>=3){ tapCount=0; let p=prompt("Password"); if(p==="nasvara123"){ localStorage.setItem('isAdmin','yes'); location.reload(); } } };
function checkAdmin(){ if(localStorage.getItem('isAdmin')==='yes' || location.search.includes('admin=nasvara')){ isAdmin=true; document.getElementById('adminPanel').style.display='block'; } } checkAdmin();
function logout(){ localStorage.removeItem('isAdmin'); location.href=location.pathname; }
function tab(t){ ['products','orders','payment'].forEach(x=>{ document.getElementById('admin-'+x).style.display='none'; document.getElementById('t-'+x).className='bg-gray-200 px-4 py-2 rounded-lg text-sm'; }); document.getElementById('admin-'+t).style.display='block'; document.getElementById('t-'+t).className='bg-black text-white px-4 py-2 rounded-lg text-sm'; if(t==='orders') loadOrders(); }
function addVar(l='',p='',s=''){ const d=document.createElement('div'); d.className='flex gap-2'; d.innerHTML=`<input value="${l}" placeholder="500g" class="v-label w-1/3 border p-2 rounded text-sm"><input value="${p}" placeholder="Price" type="number" class="v-price w-1/3 border p-2 rounded text-sm"><input value="${s}" placeholder="Stock" type="number" class="v-stock w-1/3 border p-2 rounded text-sm">`; document.getElementById('varList').appendChild(d); }
addVar('500g','',''); addVar('1kg','','');
document.getElementById('pfile').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const img=document.getElementById('preview'); img.src=URL.createObjectURL(f); img.style.display='block'; });
async function addProduct(){
  const name=document.getElementById('pname').value.trim(), cat=document.getElementById('pcat').value;
  const labs=document.querySelectorAll('.v-label'), prs=document.querySelectorAll('.v-price'), sts=document.querySelectorAll('.v-stock');
  let variants=[]; for(let i=0;i<labs.length;i++){ if(labs[i].value && prs[i].value) variants.push({label:labs[i].value,price:Number(prs[i].value),stock:Number(sts[i].value||0)}); }
  if(!name) return alert("Enter name");
  let imageUrl=document.getElementById('pimage').value.trim();
  const file=document.getElementById('pfile').files[0];
  if(file){
    document.getElementById('uploadStatus').style.display='block';
    imageUrl=await new Promise(r=>{ const fr=new FileReader(); fr.onload=e=>r(e.target.result); fr.readAsDataURL(file); });
  }
  if(!imageUrl) imageUrl='https://via.placeholder.com/300';
  const data={name,image:imageUrl,category:cat,variants,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  if(editId) await db.collection("products").doc(editId).update(data); else await db.collection("products").add(data);
  alert("Added!"); editId=null; document.getElementById('pname').value=''; document.getElementById('pimage').value=''; document.getElementById('pfile').value=''; document.getElementById('preview').style.display='none'; document.getElementById('uploadStatus').style.display='none'; document.getElementById('varList').innerHTML=''; addVar('500g','',''); addVar('1kg','','');
}
function savePay(){ const d={enableCOD:document.getElementById('enableCOD').checked,enableUPI:document.getElementById('enableUPI').checked,upiId:document.getElementById('upiId').value.trim(),enableWA:document.getElementById('enableWA').checked,waNum:document.getElementById('waNum').value.trim(),freeAbove:Number(document.getElementById('freeAbove').value||500),delCharge:Number(document.getElementById('delCharge').value||30)}; db.collection("settings").doc("payment").set(d).then(()=>alert("Saved")); }
db.collection("settings").doc("payment").onSnapshot(s=>{ if(s.exists){ payment={...payment,...s.data()}; document.getElementById('upiId').value=payment.upiId||''; document.getElementById('waNum').value=payment.waNum||''; updatePayUI(); }});
function updatePayUI(){ const info=[]; if(payment.enableCOD) info.push("✓ COD"); if(payment.enableUPI && payment.upiId) info.push("✓ UPI: "+payment.upiId); document.getElementById('payInfo').innerHTML=info.join("<br>"); const sel=document.getElementById('payMethod'); sel.innerHTML=''; if(payment.enableCOD) sel.innerHTML+=`<option value="COD">COD</option>`; if(payment.enableUPI) sel.innerHTML+=`<option value="UPI">UPI</option>`; if(payment.enableWA) sel.innerHTML+=`<option value="WhatsApp">WhatsApp</option>`; }
function filterCat(cat){ currentCat=cat; document.querySelectorAll('.cat-btn').forEach(b=>{ b.className=b.dataset.cat===cat?'cat-btn bg-black text-white px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap':'cat-btn bg-white border px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap'; }); renderFiltered(); }
function renderFiltered(){
  const con=document.getElementById('products'); let filtered=currentCat==='All'?allProducts:allProducts.filter(o=>(o.p.category||'Others')===currentCat);
  if(filtered.length===0){ con.innerHTML=`<div class='col-span-4 text-center py-20 text-gray-400'>No products in ${currentCat}<br

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Mall - Live Shopping</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-gray-50">
<!-- Header -->
<div class="bg-white shadow-sm sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="text-2xl font-bold">Mini Mall 🛒 <span class="text-green-500 text-sm">LIVE</span></h1>
    <button onclick="toggleCart()" class="bg-black text-white px-4 py-2 rounded-full">Cart (<span id="cartCount">0</span>)</button>
  </div>
</div>

<div class="max-w-6xl mx-auto px-4 py-6 grid md:grid-cols-3 gap-6">
  <!-- Admin Panel -->
  <div class="md:col-span-1 bg-white p-5 rounded-2xl shadow-sm h-fit">
    <h2 class="font-bold text-lg mb-3">Add Product (Admin)</h2>
    <input id="pname" placeholder="Product Name" class="w-full border p-2.5 rounded-lg mb-2">
    <input id="pprice" type="number" placeholder="Price ₹" class="w-full border p-2.5 rounded-lg mb-2">
    <input id="pqty" type="number" placeholder="Quantity / Stock" class="w-full border p-2.5 rounded-lg mb-2">
    <input id="pimage" placeholder="Image URL (https://...)" class="w-full border p-2.5 rounded-lg mb-3">
    <button onclick="addProduct()" class="w-full bg-black text-white py-3 rounded-xl font-semibold">+ Add to Shop LIVE</button>
    <p class="text-xs text-gray-500 mt-3">Tip: When you add, it shows to all users instantly.</p>
  </div>

  <!-- Products -->
  <div class="md:col-span-2">
    <div id="products" class="grid grid-cols-2 md:grid-cols-3 gap-4">Loading...</div>
  </div>
</div>

<!-- Cart Drawer -->
<div id="cartDrawer" class="fixed inset-0 bg-black/40 hidden">
  <div class="bg-white w-80 ml-auto h-full p-5 flex flex-col">
    <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-xl">Your Cart</h3><button onclick="toggleCart()">✕</button></div>
    <div id="cartItems" class="flex-1 overflow-auto"></div>
    <button class="bg-green-600 text-white py-3 rounded-xl mt-4">Order on WhatsApp</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCNUpsZ3KOAAdn3-CSQhS65gcKqDDxAjSs",
  authDomain: "mini-mall-94817.firebaseapp.com",
  projectId: "mini-mall-94817",
  storageBucket: "mini-mall-94817.firebasestorage.app",
  messagingSenderId: "638018323167",
  appId: "1:638018323167:web:df3ba18d8b78a592401f6a",
  measurementId: "G-9CG687KC6G"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let cart = [];

function addProduct(){
  const name = document.getElementById('pname').value.trim();
  const price = document.getElementById('pprice').value;
  const qty = document.getElementById('pqty').value || 1;
  const image = document.getElementById('pimage').value.trim();
  if(!name || !price) return alert("Enter name & price");
  db.collection("products").add({
    name, price: Number(price), qty: Number(qty), image,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    pname.value=''; pprice.value=''; pqty.value=''; pimage.value='';
  });
}

db.collection("products").orderBy("createdAt","desc").onSnapshot(snap=>{
  const con = document.getElementById('products');
  con.innerHTML = "";
  if(snap.empty){ con.innerHTML = "<p class='col-span-3 text-center text-gray-400 py-20'>No products yet. Add first product from left!</p>"; return; }
  snap.forEach(doc=>{
    const p = doc.data(); const id = doc.id;
    con.innerHTML += `
      <div class="bg-white rounded-2xl p-3 shadow-sm">
        <img src="${p.image || 'https://via.placeholder.com/300'}" class="w-full h-36 object-cover rounded-xl mb-3">
        <h4 class="font-semibold text-sm">${p.name}</h4>
        <div class="flex justify-between items-center mt-1">
          <p class="font-bold">₹${p.price}</p>
          <span class="text-xs ${p.qty>0?'bg-green-100 text-green-700':'bg-red-100 text-red-700'} px-2 py-1 rounded-full">${p.qty>0?p.qty+' in stock':'Out of stock'}</span>
        </div>
        <div class="flex gap-2 mt-3">
          <button onclick="addToCart('${id}','${p.name}',${p.price})" class="flex-1 bg-black text-white text-xs py-2 rounded-lg">Add to Cart</button>
          <button onclick="deleteProduct('${id}')" class="text-xs text-red-500 px-2">Delete</button>
        </div>
      </div>
    `;
  });
});

function addToCart(id,name,price){ cart.push({id,name,price}); renderCart(); }
function renderCart(){
  document.getElementById('cartCount').innerText = cart.length;
  const c = document.getElementById('cartItems');
  let total=0; c.innerHTML="";
  cart.forEach(item=>{ total+=item.price; c.innerHTML+=`<div class="flex justify-between py-2 border-b text-sm"><span>${item.name}</span><span>₹${item.price}</span></div>`; });
  if(cart.length) c.innerHTML+=`<div class="font-bold flex justify-between mt-3"><span>Total</span><span>₹${total}</span></div>`;
}
function toggleCart(){ document.getElementById('cartDrawer').classList.toggle('hidden'); }
function deleteProduct(id){ if(confirm("Delete this product live?")) db.collection("products").doc(id).delete(); }
</script>
</body>
</html>

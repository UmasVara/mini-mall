<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Mall LIVE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50">
<div class="bg-white shadow-sm sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 id="shopTitle" class="text-xl font-bold select-none cursor-pointer">Mini Mall 🛒 LIVE</h1>
    <div class="flex gap-2">
      <button onclick="openTrack()" class="bg-gray-100 px-3 py-2 rounded-full text-xs font-semibold">Track Order</button>
      <button onclick="toggleCart()" class="bg-black text-white px-4 py-2 rounded-full text-sm">Cart (<span id="cartCount">0</span>)</button>
    </div>
  </div>
</div>

<div class="max-w-6xl mx-auto px-4 py-6">
  <!-- ADMIN - SECRET ONLY 3x TAP ON TITLE, HIDDEN FOR CUSTOMERS -->
  <div id="adminPanel" class="hidden bg-white p-5 rounded-2xl shadow-lg mb-6 border-2 border-black">
    <div class="flex gap-2 mb-4 flex-wrap">
      <button onclick="adminTab('products')" id="tab-products" class="bg-black text-white px-4 py-2 rounded-lg text-sm">Products</button>
      <button onclick="adminTab('orders')" id="tab-orders" class="bg-gray-200 px-4 py-2 rounded-lg text-sm">Orders + Tracking</button>
      <button onclick="adminTab('payment')" id="tab-payment" class="bg-gray-200 px-4 py-2 rounded-lg text-sm">Payment</button>
      <button onclick="logoutAdmin()" class="ml-auto text-xs text-red-500 font-semibold">Logout</button>
    </div>

    <div id="admin-products">
      <h3 class="font-bold mb-2 text-sm">Add Product with 500g / 1kg options</h3>
      <input id="pname" placeholder="Product Name (ex: Basmati Rice)" class="w-full border p-2.5 rounded-lg mb-2">
      <input id="pimage" placeholder="Image URL (paste link)" class="w-full border p-2.5 rounded-lg mb-2">
      <div id="variantsList" class="space-y-2 mb-2">
        <div class="flex gap-2"><input placeholder="500g" class="variant-label w-1/3 border p-2 rounded-lg text-sm"><input placeholder="Price ₹" type="number" class="variant-price w-1/3 border p-2 rounded-lg text-sm"><input placeholder="Stock" type="number" class="variant-stock w-1/3 border p-2 rounded-lg text-sm"></div>
        <div class="flex gap-2"><input placeholder="1kg" class="variant-label w-1/3 border p-2 rounded-lg text-sm"><input placeholder="Price ₹" type="number" class="variant-price w-1/3 border p-2 rounded-lg text-sm"><input placeholder="Stock" type="number" class="variant-stock w-1/3 border p-2 rounded-lg text-sm"></div>
      </div>
      <button onclick="addVariantRow()" class="text-xs text-blue-600 mb-3">+ Add more variant</button>
      <button onclick="addProduct()" class="w-full bg-black text-white py-3 rounded-xl font-semibold">+ Add LIVE</button>
    </div>

    <div id="admin-orders" class="hidden"><div id="ordersList" class="space-y-3">Loading...</div></div>

    <div id="admin-payment" class="hidden">
      <h3 class="font-bold

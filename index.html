<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini-Mall</title>
<style>body{font-family:system-ui;background:#f5f5f7;margin:0}header{background:#0b7a3e;color:#fff;padding:14px;text-align:center;font-weight:800;font-size:18px;position:sticky;top:0;z-index:10}.cats{display:flex;gap:8px;overflow:auto;padding:10px;position:sticky;top:48px;background:#f5f5f7;z-index:9}.cats button{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;white-space:nowrap}.cats button.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.06);cursor:pointer}.card img{width:100%;height:170px;object-fit:cover}.info{padding:8px}.mrp{color:#0b7a3e;font-weight:800;font-size:16px}.qty{color:#666;font-size:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99;padding:16px;overflow:auto}.box{background:#fff;border-radius:16px;max-width:440px;width:100%;max-height:95vh;overflow:auto}.m-img{width:100%;height:300px;object-fit:contain;background:#f5f5f5}.thumbs{display:flex;gap:6px;padding:10px;overflow:auto}.thumbs img{width:56px;height:56px;border-radius:8px;border:2px solid transparent;object-fit:cover}.thumbs img.active{border-color:#111}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px;box-sizing:border-box}button.pay{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;margin-top:8px}.status{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff}.st-Placed{background:#f59e0b}.st-Packed{background:#3b82f6}.st-Shipped{background:#8b5cf6}.st-Delivered{background:#10b981}</style></head>
<body>
<header>Mini-Mall - Vegetables & Grocery</header>
<div class="cats"><button class="active" onclick="filterCat('All',this)">All</button><button onclick="filterCat('Vegetables',this)">Vegetables</button><button onclick="filterCat('Grocery',this)">Grocery</button><button onclick="filterCat('Milk & Products',this)">Milk & Products</button><button onclick="filterCat('Others',this)">Others</button></div>
<div id="ordersBox" style="background:#fff;margin:10px;border-radius:12px;padding:12px;display:none"><h3 style="margin:0 0 8px">My Orders</h3><div id="ordersList"></div></div>
<div id="grid" class="grid"></div>

<div id="modal" class="modal" onclick="if(event.target.id==='modal')modal.style.display='none'"><div class="box">
<img id="mImg" class="m-img"><div id="mThumbs" class="thumbs"></div><div id="mVideo" style="padding:0 10px"></div>
<div style="padding:12px">
<h3 id="mName" style="margin:0"></h3>
<div><span class="mrp" id="mPrice"></span> <span class="qty" id="mQty"></span></div>
<div id="mCat" style="font-size:11px;color:#666"></div>

<div id="buyForm" style="margin-top:12px;border-top:1px solid #eee;padding-top:10px">
<h4 style="margin:8px 0">Delivery Address</h4>
<input id="cName" placeholder="Your Name *">
<input id="cPhone" placeholder="Phone Number *">
<input id="cPlot" placeholder="Plot No. / House No. *">
<input id="cApt" placeholder="Apartment / Building Name *">
<textarea id="cAddr" placeholder="Street, Area, Landmark *" rows="2"></textarea>
<input id="cPin" placeholder="Pincode (Optional)">
<select id="cPay"><option value="COD">Cash on Delivery</option><option value="UPI">UPI Payment</option><option value="WhatsApp">WhatsApp Order</option></select>
<div id="payInfo" style="font-size:12px;background:#f0fdf4;padding:8px;border-radius:8px;margin-top:8px"></div>
<button class="pay" style="background:#0b7a3e;color:#fff" onclick="placeOrder()">Confirm Order</button>
</div>
<button onclick="modal.style.display='none'" style="width:100%;padding:12px;background:#eee;border:0;border-radius:10px;margin-top:8px">Close</button>
</div></div></div>

<script>
let products=JSON.parse(localStorage.getItem('minimall_products')||'[]');
let orders=JSON.parse(localStorage.getItem('minimall_orders')||'[]');
let settings=JSON.parse(localStorage.getItem('minimall_settings')||'{"upi":"umasvara@upi","wa":"919000000000","delivery":0,"cod":true}');
let cur=null,curFilter='All';
products=products.filter(p=>!['Mens','Sarees','Home','Electronics'].includes(p.cat));
if(products.length===0){products=[
{id:1,name:'Fresh Tomato',price:30,qty:'1kg',cat:'Vegetables',images:['https://images.unsplash.com/photo-1582284540020-8acbe03f4924?w=500'],video:''},
{id:2,name:'Pure Milk',price:32,qty:'1 Litre',cat:'Milk & Products',images:['https://images.unsplash.com/photo-1550583724-b2692b85b150?w=500'],video:''},
{id:3,name:'Atta',price:180,qty:'5kg',cat:'Grocery',images:['https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=500'],video:''}
];}
localStorage.setItem('minimall_products',JSON.stringify(products));

function filterCat(c,btn){curFilter=c;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderProducts();}
function renderProducts(){let list=curFilter==='All'?products:products.filter(p=>p.cat===curFilter);grid.innerHTML=list.map(p=>`<div class="card" onclick="openP(${products.indexOf(p)})"><img src="${p.images[0]}"><div class="info"><div style="font-weight:700;font-size:14px">${p.name}</div><div><span class="mrp">MRP ₹${p.price}</span></div><div class="qty">${p.qty} - ${p.cat}</div></div></div>`).join('');}
function openP(i){cur=products[i];modal.style.display='flex';mName.textContent=cur.name;mPrice.textContent='MRP ₹'+cur.price;mQty.textContent=' / '+cur.qty;mCat.textContent=cur.cat;mImg.src=cur.images[0];mThumbs.innerHTML=cur.images.map((im,j)=>`<img src="${im}" class="${j==0?'active':''}" onclick="mImg.src=this.src;document.querySelectorAll('#mThumbs img').forEach(x=>x.classList.remove('active'));this.classList.add('active')">`).join('');let v=cur.video||'',vh='';if(v){if(v.includes('youtu')||v.includes('youtube')){let id=v.split('v=')[1]?.split('&')[0]||v.split('/').pop().split('?')[0];vh=`<iframe height="210" width="100%" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen style="border-radius:10px"></iframe>`;}else{vh=`<video controls width="100%" src="${v}" style="border-radius:10px"></video>`;}}mVideo.innerHTML=vh?'<div style="margin-top:8px"><b>Video</b>'+vh+'</div>':'';updatePayInfo();cPay.onchange=updatePayInfo;}
function updatePayInfo(){let pay=cPay.value,html='';if(pay==='COD'){html=settings.cod?`COD Available. Delivery: ₹${settings.delivery}`:'COD Not Available';}else if(pay==='UPI'){html=`Pay to UPI: <b>${settings.upi}</b>`;}else{html=`Order via WhatsApp: <b>${settings.wa}</b>`;}payInfo.innerHTML=html;}
function placeOrder(){let nm=cName.value.trim(),ph=cPhone.value.trim(),pl=cPlot.value.trim(),ap=cApt.value.trim(),ad=cAddr.value.trim(),pin=cPin.value.trim(),pay=cPay.value;if(!nm||!ph||!pl||!ap||!ad){alert('Fill Name, Phone, Plot No, Apartment, Address');return;}let order={id:Date.now(),name:cur.name,price:cur.price,qty:cur.qty,image:cur.images[0],cat:cur.cat,customer:{name:nm,phone:ph,plot:pl,apt:ap,addr:ad,pin:pin,pay:pay},status:'Placed',date:new Date().toLocaleString(),delivery:settings.delivery,total:cur.price+parseInt(settings.delivery||0)};orders.unshift(order);localStorage.setItem('minimall_orders',JSON.stringify(orders));renderOrders();modal.style.display='none';if(pay==='WhatsApp'){let txt=`*Mini-Mall Order*%0A${order.name} (${order.qty}) - MRP ₹${order.price}%0AName:${nm}%0APhone:${ph}%0APlot:${pl}%0AApt:${ap}%0AAddr:${ad}%0APin:${pin||'NA'}%0ATotal:₹${order.total}`;window.open(`https://wa.me/${settings.wa}?text=${txt}`,'_blank');}else if(pay==='UPI'){window.open(`upi://pay?pa=${settings.upi}&pn=Mini-Mall&am=${order.total}&cu=INR`,'_blank');}alert('Order Placed!');cName.value='';cPhone.value='';cPlot.value='';cApt.value='';cAddr.value='';cPin.value='';}
function deleteOrder(id){if(confirm('Delete order?')){orders=orders.filter(o=>o.id!==id);localStorage.setItem('minimall_orders',JSON.stringify(orders));renderOrders();}}
function renderOrders(){if(!orders.length){ordersBox.style.display='none';return;}ordersBox.style.display='block';ordersList.innerHTML=orders.map(o=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee"><div style="display:flex;gap:8px;flex:1"><img src="${o.image}" style="width:48px;height:48px;border-radius:8px;object-fit:cover"><div><div style="font-weight:700;font-size:13px">${o.name} (${o.qty})</div><div style="font-size:11px">MRP ₹${o.price} + Del ₹${o.delivery} = ₹${o.total} | ${o.customer.pay}</div><div style="font-size:11px">${o.customer.plot}, ${o.customer.apt}, ${o.customer.addr} ${o.customer.pin?'- '+o.customer.pin:''}</div><div style="margin-top:3px"><span class="status st-${o.status}">${o.status}</span> - ${o.date}</div></div></div><button onclick="deleteOrder(${o.id})" style="background:#222;color:#fff;border:0;padding:6px 12px;border-radius:7px;height:30px">Delete</button></div>`).join('');}
renderProducts();renderOrders();
</script>
</body></html>

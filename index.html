<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini-Mall</title>
<style>body{font-family:system-ui;background:#f5f5f7;margin:0}header{background:#0b7a3e;color:#fff;padding:14px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;position:sticky;top:0;z-index:20}.cartBtn{background:#fff;color:#0b7a3e;padding:6px 14px;border-radius:20px;border:0;font-weight:800;position:relative}.count{position:absolute;top:-6px;right:-6px;background:red;color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center}.cats{display:flex;gap:8px;overflow:auto;padding:10px;position:sticky;top:48px;background:#f5f5f7;z-index:9}.cats button{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;white-space:nowrap}.cats button.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.06)}.card img{width:100%;height:160px;object-fit:cover;cursor:pointer}.info{padding:8px}.mrp{color:#0b7a3e;font-weight:800}.qty{color:#666;font-size:12px}.addBtn{width:100%;margin-top:6px;padding:8px;background:#0b7a3e;color:#fff;border:0;border-radius:8px;font-weight:700}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99;padding:16px;overflow:auto}.box{background:#fff;border-radius:16px;max-width:440px;width:100%;max-height:95vh;overflow:auto}.m-img{width:100%;height:280px;object-fit:contain;background:#f5f5f5}.thumbs{display:flex;gap:6px;padding:10px;overflow:auto}.thumbs img{width:56px;height:56px;border-radius:8px;border:2px solid transparent;object-fit:cover}.thumbs img.active{border-color:#111}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px;box-sizing:border-box}button.pay{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;margin-top:8px}.status{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff}.st-Placed{background:#f59e0b}.st-Packed{background:#3b82f6}.st-Shipped{background:#8b5cf6}.st-Delivered{background:#10b981}.cartItem{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.qBtn{padding:4px 10px;border:1px solid #ddd;background:#fff;border-radius:6px;font-weight:800}</style></head>
<body>
<header><span>Mini-Mall - Vegetables & Grocery</span><button class="cartBtn" onclick="openCart()">🛒 Cart <span id="cartCount" class="count" style="display:none">0</span></button></header>
<div class="cats"><button class="active" onclick="filterCat('All',this)">All</button><button onclick="filterCat('Vegetables',this)">Vegetables</button><button onclick="filterCat('Grocery',this)">Grocery</button><button onclick="filterCat('Milk & Products',this)">Milk & Products</button><button onclick="filterCat('Others',this)">Others</button></div>

<div id="ordersBox" style="background:#fff;margin:10px;border-radius:12px;padding:12px;display:none"><h3 style="margin:0 0 8px">My Orders - Tracking</h3><div id="ordersList"></div></div>
<div id="grid" class="grid"></div>

<!-- Product Modal -->
<div id="modal" class="modal" onclick="if(event.target.id==='modal')modal.style.display='none'"><div class="box">
<img id="mImg" class="m-img"><div id="mThumbs" class="thumbs"></div><div id="mVideo" style="padding:0 10px"></div>
<div style="padding:12px">
<h3 id="mName" style="margin:0"></h3>
<div><span class="mrp" id="mPrice"></span> <span class="qty" id="mQty"></span></div>
<div id="mCat" style="font-size:11px;color:#666"></div>
<button class="pay" style="background:#0b7a3e;color:#fff" onclick="addToCartCurrent()">Add to Cart</button>
<button class="pay" style="background:#111;color:#fff" onclick="buyNowCurrent()">Buy Now</button>
<button onclick="modal.style.display='none'" style="width:100%;padding:12px;background:#eee;border:0;border-radius:10px;margin-top:8px">Close</button>
</div></div></div>

<!-- Cart Modal -->
<div id="cartModal" class="modal" onclick="if(event.target.id==='cartModal')cartModal.style.display='none'"><div class="box" style="padding:12px">
<h3 style="margin:0 0 10px">🛒 My Cart (<span id="cartCount2">0</span>)</h3>
<div id="cartItems"></div>
<div id="cartTotal" style="font-weight:800;font-size:18px;margin-top:10px;border-top:1px solid #eee;padding-top:10px"></div>

<div id="cartForm" style="margin-top:12px;border-top:1px solid #eee;padding-top:10px">
<h4 style="margin:8px 0">Delivery Address</h4>
<input id="cName" placeholder="Your Name *">
<input id="cPhone" placeholder="Phone Number *">
<input id="cPlot" placeholder="Plot No. / House No. *">
<input id="cApt" placeholder="Apartment / Building Name *">
<textarea id="cAddr" placeholder="Street, Area, Landmark *" rows="2"></textarea>
<input id="cPin" placeholder="Pincode (Optional)">
<select id="cPay"><option value="COD">Cash on Delivery</option><option value="UPI">UPI Payment</option><option value="WhatsApp">WhatsApp Order</option></select>
<div id="payInfo" style="font-size:12px;background:#f0fdf4;padding:8px;border-radius:8px;margin-top:8px"></div>
<button class="pay" style="background:#0b7a3e;color:#fff" onclick="placeCartOrder()">Place Order - All Items</button>
</div>
<button onclick="cartModal.style.display='none'" style="width:100%;padding:12px;background:#eee;border:0;border-radius:10px;margin-top:8px">Continue Shopping</button>
</div></div>

<script>
let products=JSON.parse(localStorage.getItem('minimall_products')||'[]');
let orders=JSON.parse(localStorage.getItem('minimall_orders')||'[]');
let cart=JSON.parse(localStorage.getItem('minimall_cart')||'[]');
let settings=JSON.parse(localStorage.getItem('minimall_settings')||'{"upi":"umasvara@upi","wa":"919000000000","delivery":0,"cod":true}');
let cur=null,curFilter='All';
products=products.filter(p=>!['Mens','Sarees','Home','Electronics'].includes(p.cat));

{id:2,name:'Pure Milk',price:32,qty:'1 Litre',cat:'Milk & Products',images:['https://images.unsplash.com/photo-1550583724-b2692b85b150?w=500'],video:''},
{id:3,name:'Atta',price:180,qty:'5kg',cat:'Grocery',images:['https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=500'],video:''}
];}
localStorage.setItem('minimall_products',JSON.stringify(products));

function saveCart(){localStorage.setItem('minimall_cart',JSON.stringify(cart));updateCartCount();}
function updateCartCount(){let c=cart.reduce((s,i)=>s+i.qnty,0);let el=document.getElementById('cartCount');if(c>0){el.style.display='flex';el.textContent=c;document.getElementById('cartCount2').textContent=c;}else{el.style.display='none';document.getElementById('cartCount2').textContent='0';}}
function filterCat(c,btn){curFilter=c;document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderProducts();}
function renderProducts(){let list=curFilter==='All'?products:products.filter(p=>p.cat===curFilter);grid.innerHTML=list.map(p=>`<div class="card"><img src="${p.images[0]}" onclick="openP(${products.indexOf(p)})"><div class="info"><div style="font-weight:700;font-size:14px;cursor:pointer" onclick="openP(${products.indexOf(p)})">${p.name}</div><div><span class="mrp">MRP ₹${p.price}</span></div><div class="qty">${p.qty} - ${p.cat}</div><button class="addBtn" onclick="addToCart(${products.indexOf(p)})">Add to Cart</button></div></div>`).join('');}
function openP(i){cur=products[i];modal.style.display='flex';mName.textContent=cur.name;mPrice.textContent='MRP ₹'+cur.price;mQty.textContent=' / '+cur.qty;mCat.textContent=cur.cat;mImg.src=cur.images[0];mThumbs.innerHTML=cur.images.map((im,j)=>`<img src="${im}" class="${j==0?'active':''}" onclick="mImg.src=this.src;document.querySelectorAll('#mThumbs img').forEach(x=>x.classList.remove('active'));this.classList.add('active')">`).join('');let v=cur.video||'',vh='';if(v){if(v.includes('youtu')||v.includes('youtube')){let id=v.split('v=')[1]?.split('&')[0]||v.split('/').pop().split('?')[0];vh=`<iframe height="210" width="100%" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen style="border-radius:10px"></iframe>`;}else{vh=`<video controls width="100%" src="${v}" style="border-radius:10px"></video>`;}}mVideo.innerHTML=vh?'<div style="margin-top:8px"><b>Video</b>'+vh+'</div>':'';}
function addToCart(idx){let p=products[idx];let f=cart.find(c=>c.id===p.id);if(f){f.qnty++;}else{cart.push({id:p.id,name:p.name,price:p.price,qty:p.qty,image:p.images[0],qnty:1});}saveCart();alert('Added to Cart!');}
function addToCartCurrent(){addToCart(products.indexOf(cur));modal.style.display='none';}
function buyNowCurrent(){addToCartCurrent();openCart();}
function openCart(){cartModal.style.display='flex';renderCart();updatePayInfo();}
function renderCart(){if(!cart.length){cartItems.innerHTML='<div style="padding:20px;text-align:center;color:#888">Cart is empty</div>';cartTotal.textContent='';cartForm.style.display='none';return;}cartForm.style.display='block';cartItems.innerHTML=cart.map((it,i)=>`<div class="cartItem"><img src="${it.image}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"><div style="flex:1"><div style="font-weight:700;font-size:13px">${it.name}</div><div style="font-size:12px">MRP ₹${it.price} / ${it.qty}</div><div style="margin-top:4px"><button class="qBtn" onclick="changeQty(${i},-1)">-</button> <span style="padding:0 8px;font-weight:
